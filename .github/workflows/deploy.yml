name: CD - Publicacao Segura no GitHub Pages

# A publicacao ocorre somente depois do merge/push na main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    name: Build, Lint e Testes
    uses: ./.github/workflows/validate.yml

  seguranca:
    name: SAST + DAST
    needs: [validar]
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  deploy:
    name: Fase 3 - Publicar no GitHub Pages
    needs: [validar, seguranca]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      # Publica somente public/: testes, scripts e workflows nao vao ao ar.
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
