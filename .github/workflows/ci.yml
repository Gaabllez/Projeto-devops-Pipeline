name: CI - Validacao, Testes e Seguranca

# GitFlow: valida pushes em branches de trabalho e PRs antes da integracao.
on:
  push:
    branches:
      - develop
      - "feature/**"
      - "feat/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Build, Lint e Testes
    uses: ./.github/workflows/validate.yml

  seguranca:
    name: SAST + DAST
    needs: [validar]
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
